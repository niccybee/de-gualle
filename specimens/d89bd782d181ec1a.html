<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>de-gualle component specimen</title>
<link rel="stylesheet" href="../css/de-gualle.css">
<style>body{margin:0;padding:1rem}body>main{padding:0}body>:first-child{margin-top:0}</style>
</head><body data-size="md"><section data-de-gualle data-dashboard aria-labelledby="overview-title">
  <header><h1 id="overview-title">Overview</h1></header>
  <dl>
    <div>
      <dt>Active projects</dt>
      <dd>12</dd>
    </div>
    <div>
      <dt>Tasks completed</dt>
      <dd>148</dd>
    </div>
  </dl>
  <form role="search">
    <label for="query">Find a project</label>
    <input id="query" name="query" type="search" />
  </form>
  <p role="status">3 projects shown.</p>
  <div data-overflow tabindex="0" role="region" aria-label="Projects">
    <table>
      <caption>Recent projects</caption>
      <thead>
        <tr>
          <th scope="col">Project</th>
          <th scope="col">Status</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row">Website refresh</th>
          <td>In progress</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
</body></html>
