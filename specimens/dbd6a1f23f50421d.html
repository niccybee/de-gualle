<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>de-gualle component specimen</title>
<link rel="stylesheet" href="../css/de-gualle.css">
<style>body{margin:0;padding:1rem}body>main{padding:0}body>:first-child{margin-top:0}</style>
</head><body data-size="md"><label>Name <input name="name" autocomplete="name" placeholder="Alex Chen"></label>
<label>Email <input type="email" name="email" autocomplete="email"></label>
<label>Password <input type="password" name="password" autocomplete="new-password"></label>
<label>Search <input type="search" name="query"></label>
<label>Telephone <input type="tel" name="phone" autocomplete="tel"></label>
<label>Website <input type="url" name="website" placeholder="https://example.com"></label>
</body></html>
